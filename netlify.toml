# ============================================================
#  Configuración de Netlify para Trade Fox 🦊
#  Este archivo le dice a Netlify cómo publicar la web.
# ============================================================

[build]
  # Carpeta que se publica (la raíz del proyecto)
  publish = "."
  # No hay proceso de build porque es HTML puro
  command = ""

# Configuración del sitio
# El nombre del sitio se define en el panel de Netlify,
# no aquí. Ejemplo: tradefox.netlify.app

# Redirecciones y cabeceras útiles
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache de imágenes estáticas (mejora velocidad)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ============================================================
#  SEGURIDAD DEL PANEL DE ADMINISTRACIÓN
#  Una Edge Function protege /admin y /admin.html con contraseña.
#  La contraseña se define en la variable de entorno ADMIN_PASSWORD
#  (Netlify → Site settings → Environment variables).
#  Sin esa contraseña, el panel no se sirve en absoluto.
# ============================================================
[[edge_functions]]
  function = "admin-auth"
  path = "/admin"

[[edge_functions]]
  function = "admin-auth"
  path = "/admin.html"

# Redirección del panel de administración
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
